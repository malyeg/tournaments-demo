function answer(i) { const s = S(), L = leaders();
  if (i === 0) return { t: 'هؤلاء أفضل 5 ' + s.leaderOne + ' تحت 16 سنة في منطقة القاهرة حتى الجولة 15:', h: '<table><tr><th>#</th><th>اللاعب</th><th>النادي</th><th class="num">' + (s.kind === 'team' ? 'المعدل' : 'النقاط') + '</th></tr>' + L.map((x, k) => '<tr><td>' + (k + 1) + '</td><td><b>' + x.n + '</b></td><td>' + x.c + '</td><td class="num">' + x.v + '</td></tr>').join('') + '</table>' };
  if (i === 1) return { t: 'في الإسكندرية 412 لاعبة مقيدة تحت 16 سنة، بزيادة 9% عن الموسم الماضي. توزيعهن على الأندية:', h: [['سبورتنج', 148], ['سموحة', 121], ['الاتحاد السكندري', 96], ['أندية أخرى', 47]].map(r => '<div class="row" style="margin:8px 0"><span class="sm" style="width:130px">' + r[0] + '</span><div class="bar grow"><i style="width:' + Math.round(r[1] / 148 * 100) + '%"></i></div><b class="sm" style="width:36px;text-align:end">' + r[1] + '</b></div>').join('') };
  if (i === 2) return { t: 'أقل ثلاث محافظات في عدد المباريات هذا الموسم. قد تحتاج دعماً بالملاعب أو الحكام:', h: '<table><tr><th>المحافظة</th><th class="num">المباريات</th><th class="num">الأندية</th></tr>' + [['أسوان', 38, 4], ['الوادي الجديد', 41, 3], ['مطروح', 52, 5]].map(r => '<tr><td><b>' + r[0] + '</b></td><td class="num">' + r[1] + '</td><td class="num">' + r[2] + '</td></tr>').join('') + '</table>' };
  if (i === 3) return { t: 'تأجلت 3 مباريات هذا الشهر:', h: '<div class="list">' + [['الجزيرة × سموحة', 'الملعب غير متاح'], ['الطيران × سبورتنج', 'مشاركة لاعبين مع المنتخب'], ['الزمالك × الاتحاد السكندري', 'قرار غلق المنشآت في التاسعة مساءً']].map(r => '<div class="item"><b class="sm grow">' + r[0] + '</b><span class="badge warn">' + r[1] + '</span></div>').join('') + '</div><div class="xs muted" style="margin-top:8px">اقتُرح موعد بديل للمباريات الثلاث تلقائياً.</div>' };
  return { t: 'هذه نسخة تجريبية ببيانات محدودة. جرّب أحد الأسئلة المقترحة لترى شكل الإجابة.', h: '' }; }
function ask(q, i) { if (!q) { q = $('q').value.trim(); if (!q) { toast('اكتب سؤالك أولاً'); return; } i = questions().indexOf(q); }
  st.askLog.push({ q, i, done: false }); render();
  setTimeout(() => { const a = answer(i), id = 'ans' + (st.askLog.length - 1); if (!$(id)) return; typeInto(id, a.t, () => { st.askLog[st.askLog.length - 1].done = true; if (st.screen === 'ask') render(); }); }, 600); }
VIEWS.ask = () => { const Q = questions();
  return '<h1>اسأل بياناتك ' + aiTag() + '</h1><p class="sub">اكتب سؤالك بالعربية كما تسأل زميلاً، وتأتيك الإجابة من بيانات الاتحاد.</p>' +
  '<div class="card mb"><div class="row"><input id="q" placeholder="مثال: كم لاعباً مقيداً تحت 14 سنة في الجيزة؟" onkeydown="if(event.key===\'Enter\')ask()"><button class="btn" onclick="ask()">اسأل</button></div><div class="row wrap mt">' + Q.map((q, i) => '<button class="pick" onclick="ask(\'' + q + '\',' + i + ')">' + q + '</button>').join('') + '</div></div>' +
  st.askLog.map((x, k) => { const a = answer(x.i); return '<div class="card mb" style="background:var(--color-muted)"><b class="sm">' + x.q + '</b></div><div class="aibox mb">' + (x.done ? '<p class="sm" style="margin:0 0 10px">' + a.t + '</p><div class="fade scrollx">' + a.h + '</div>' : '<span class="spin"></span> <span class="sm" id="ans' + k + '"></span>') + '</div>'; }).join('') +
  (st.askLog.length ? '' : '<div class="card muted sm" style="text-align:center;padding:32px 16px">اختر سؤالاً من المقترحات أعلاه لتبدأ.</div>'); };
AFTER.ask = () => { const l = st.askLog[st.askLog.length - 1]; if (l && !l.done && $('ans' + (st.askLog.length - 1))) $('ans' + (st.askLog.length - 1)).textContent = '…'; };

/* ---------- 12. ministry overview ---------- */
const MIN = { basketball:[18420,214,4120], volleyball:[21300,236,4870], handball:[16950,188,3960], padel:[9800,131,2240], tennis:[12640,142,6310], squash:[14210,96,7350] };
const GOV = [['القاهرة', 22.4, 71], ['الجيزة', 13.1, 64], ['الإسكندرية', 12.6, 68], ['الدقهلية', 7.2, 49], ['الشرقية', 6.4, 44], ['أسيوط', 3.9, 37], ['بورسعيد', 3.1, 58], ['أسوان', 1.8, 29]];
VIEWS.ministry = () => { const f = st.minSport, keys = Object.keys(SPORTS), tot = k => sum((f ? [f] : keys).map(x => MIN[x][k])), share = f ? MIN[f][0] / sum(keys.map(x => MIN[x][0])) : 1, max = Math.max(...keys.map(k => MIN[k][0]));
  return '<h1>' + CONFIG.ministry + ' — نظرة عامة</h1><p class="sub">كل الألعاب وكل المحافظات في شاشة واحدة. الأرقام تجريبية لأغراض العرض فقط.</p>' +
  '<div class="tabs"><button class="pick' + (!f ? ' on' : '') + '" onclick="st.minSport=null;render()">كل الألعاب</button>' + keys.map(k => '<button class="pick' + (f === k ? ' on' : '') + '" style="--sport:' + SPORTS[k].color + '" onclick="st.minSport=\'' + k + '\';render()">' + SPORTS[k].name + '</button>').join('') + '</div>' +
  '<div class="grid kpis"><div class="card kpi"><b>' + fmt(tot(0)) + '</b><span>لاعب ولاعبة مقيدون</span><small>+7.4% عن الموسم الماضي</small></div><div class="card kpi"><b>' + fmt(tot(1)) + '</b><span>نادٍ وهيئة ومركز شباب</span><small>في 27 محافظة</small></div><div class="card kpi"><b>' + fmt(tot(2)) + '</b><span>مباراة رسمية هذا الموسم</span><small>98% بنتيجة معتمدة</small></div><div class="card kpi"><b>46%</b><span>متوسط إشغال الملاعب</span><small style="color:var(--color-warning)">فرصة لزيادة الاستخدام</small></div></div>' +
  '<div class="grid g2"><div class="card"><h2>اللاعبون المقيدون حسب اللعبة</h2>' + keys.map(k => '<div class="row" style="margin:10px 0;cursor:pointer;opacity:' + (f && f !== k ? .35 : 1) + '" onclick="openSport(\'' + k + '\')" title="افتح لوحة الاتحاد"><span class="sm" style="width:108px">' + SPORTS[k].name + '</span><div class="bar grow"><i style="--c:' + SPORTS[k].color + ';width:' + Math.round(MIN[k][0] / max * 100) + '%"></i></div><b class="sm" style="width:58px;text-align:end">' + fmt(MIN[k][0]) + '</b></div>').join('') + '<div class="xs muted">اضغط على أي لعبة لفتح لوحة اتحادها.</div></div>' +
  '<div class="card"><h2>الفئات</h2>' + [['ذكور', 61, 'var(--color-info)'], ['إناث', 39, 'var(--color-accent)']].map(r => '<div class="row" style="margin:10px 0"><span class="sm" style="width:108px">' + r[0] + '</span><div class="bar grow"><i style="--c:' + r[2] + ';width:' + r[1] + '%"></i></div><b class="sm" style="width:58px;text-align:end">' + r[1] + '%</b></div>').join('') +
    [['تحت 14 سنة', 34], ['تحت 16 سنة', 27], ['تحت 18 سنة', 21], ['الكبار', 18]].map(r => '<div class="row" style="margin:10px 0"><span class="sm" style="width:108px">' + r[0] + '</span><div class="bar grow"><i style="width:' + r[1] * 2.5 + '%"></i></div><b class="sm" style="width:58px;text-align:end">' + r[1] + '%</b></div>').join('') + '</div></div>' +
  '<div class="card mt scrollx"><h2>المحافظات</h2><table><tr><th>المحافظة</th><th class="num">اللاعبون المقيدون</th><th class="num">المباريات</th><th>إشغال الملاعب</th></tr>' + GOV.map(g => '<tr><td><b>' + g[0] + '</b></td><td class="num">' + fmt(Math.round(g[1] * 1000 * share)) + '</td><td class="num">' + fmt(Math.round(g[1] * 310 * share)) + '</td><td><div class="row"><div class="bar grow" style="min-width:80px"><i style="--c:' + (g[2] < 40 ? 'var(--color-destructive)' : g[2] < 60 ? 'var(--color-warning)' : 'var(--color-success)') + ';width:' + g[2] + '%"></i></div><span class="sm" style="width:40px">' + g[2] + '%</span></div></td></tr>').join('') + '</table></div>' +
  '<div class="aibox mt"><div class="row wrap">' + aiTag() + '<span class="sm grow"><b>اسأل عن أي رقم:</b> «كم لاعبة تحت 16 سنة تمارس الكرة الطائرة في الإسكندرية؟»</span><button class="btn" onclick="st.sport=\'volleyball\';st.askLog=[];go(\'ask\');ask(questions()[1],1)">جرّب السؤال</button></div></div>'; };
function openSport(k) { setSport(k); go('home'); }

/* ---------- sketch toolbar ---------- */
function vp(w) { $('app').style.maxWidth = w; }
let annoOn = false;
document.addEventListener('mousemove', ev => { const a = $('anno'); if (!annoOn || ev.target.closest('#sketch-tools')) { a.style.display = 'none'; return; }
  const c = getComputedStyle(ev.target); a.textContent = ev.target.tagName.toLowerCase() + ' · ' + c.fontSize + ' · ' + c.color + ' · pad ' + c.padding; a.style.display = 'block'; a.style.left = Math.min(ev.clientX + 12, innerWidth - 320) + 'px'; a.style.top = (ev.clientY + 14) + 'px'; });

render();
</script>
</body>
</html>
